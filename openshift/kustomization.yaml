apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
- tools/vendor/github.com/openshift/cluster-capi-operator/manifests-gen

resources:
- ../config/default
- ../config/ipam

patches:
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3clusters.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3clustertemplates.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3machines.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3machinetemplates.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3datas.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3dataclaims.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3datatemplates.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3remediations.infrastructure.cluster.x-k8s.io
- path: ./patches/remediation-crd-adopt-existing.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3remediations.infrastructure.cluster.x-k8s.io
- path: ./patches/crd-storage-version.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3remediationtemplates.infrastructure.cluster.x-k8s.io
- path: ./patches/remediation-crd-adopt-existing.yaml
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: metal3remediationtemplates.infrastructure.cluster.x-k8s.io

# Add TLS configuration args (substituted by cluster-capi-operator revisiongenerator)
# NOTE: --tls-min-version is already set in upstream config/manager/manager.yaml
- target:
    kind: Deployment
    name: capm3-controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--tls-cipher-suites=${TLS_CIPHER_SUITES}"

images:
- name: quay.io/metal3-io/cluster-api-provider-metal3
  newName: registry.ci.openshift.org/openshift
  newTag: baremetal-cluster-api-controllers
