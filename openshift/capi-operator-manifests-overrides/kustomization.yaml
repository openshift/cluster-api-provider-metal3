# Post-processes the manifests generated by manifests-gen (see the
# ocp-manifests target in openshift/Makefile).
#
# manifests-gen applies its own defaults to every Deployment after running
# kustomize on openshift/kustomization.yaml: each container's resource requests
# are set to cpu 10m / memory 50Mi and its limits are removed. Patches in
# openshift/kustomization.yaml therefore cannot change resource requests.
# Provider-specific values are applied here, after generation, instead.
#
# Do not edit capi-operator-manifests/ by hand; run `make ocp-manifests`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../capi-operator-manifests/default/manifests.yaml

# Keep the generated resource order so this step only changes patched fields.
sortOptions:
  order: fifo

patches:
# No-op merge that makes the build fail if the Deployment is renamed or
# removed. A target-selected patch alone would silently match nothing.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: capm3-controller-manager
      namespace: openshift-cluster-api

# Provider-specific memory request for the manager container, applied on top
# of the manifests-gen defaults. Only the memory request is replaced: the cpu
# request and the absence of limits still come from manifests-gen.
# The test operations make the build fail if the first container is not
# "manager", or if the manifests-gen default memory request is no longer
# 50Mi. In the latter case, re-evaluate whether this override is still needed
# rather than silently overriding the new default.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: capm3-controller-manager
    namespace: openshift-cluster-api
  patch: |-
    - op: test
      path: /spec/template/spec/containers/0/name
      value: manager
    - op: test
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 50Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 80Mi
